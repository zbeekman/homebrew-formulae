name: Specs

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: "specs-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  specs:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-26, macos-15-intel ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
          - os: ubuntu-24.04-arm
            container:
              image: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    # arm64 Linux is experimental here.
    continue-on-error: ${{ matrix.os == 'ubuntu-24.04-arm' }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      # Unit specs and brew-internals canaries, with a coverage summary.
      # In containers `setup-homebrew` leaves the tap out of the workspace.
      - run: brew ruby -- spec/run.rb
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
